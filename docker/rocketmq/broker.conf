# RocketMQ Broker 配置（本地单机学习用）
brokerClusterName=DefaultCluster
brokerName=broker-a
brokerId=0
# 关键：注册给 NameServer 的地址。容器默认注册容器内 IP，宿主机应用连不上。
# 这个地址要同时满足两个客户端都能连到 broker：
#   - 宿主机应用：经 Docker 的 0.0.0.0:10911 端口映射进 broker 容器
#   - dashboard 容器：在 rocketmq 网络里跨子网连宿主机的这个 IP
# 用宿主机局域网 IP（ipconfig 查）并已实测两边均连通：
#   - 127.0.0.1          → dashboard 容器内 127.0.0.1=自己，连不上（原值，dashboard 查不到消息的根因）
#   - host.docker.internal → 容器内可连，但宿主机解析到的地址连不上 10911
brokerIP1=192.168.15.173
# 注意：换网络后局域网 IP 会变，需同步改这一行。若想一劳永逸，可改用服务名 broker，
#       并在 Windows hosts 加 "127.0.0.1 broker"（127.0.0.1 永不变，但需管理员权限编辑一次）。
# NameServer 地址（容器内用服务名）
namesrvAddr=namesrv:9876
# Broker 监听端口
listenPort=10911
# 自动创建 Topic / 消费组，学习方便（线上应关闭）
autoCreateTopicEnable=true
autoCreateSubscriptionGroup=true
# 文件保留 / 删除时间
fileReservedTime=48
deleteWhen=04
brokerRole=ASYNC_MASTER
flushDiskType=ASYNC_FLUSH
